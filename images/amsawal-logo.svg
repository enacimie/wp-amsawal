<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Atlas Mountains inspired background -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c5f8d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e4364;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sunGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e67e22;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle with Atlas blue gradient -->
  <circle cx="100" cy="100" r="95" fill="url(#skyGradient)" />
  
  <!-- Mountain range silhouette (Atlas Mountains) -->
  <path d="M20 130 L50 80 L70 110 L90 60 L110 90 L130 50 L150 85 L170 65 L190 100 L200 130 L0 130 Z" 
        fill="#d4af37" opacity="0.9" />
  
  <!-- Sun symbol (Amazigh cultural element) -->
  <circle cx="100" cy="70" r="25" fill="url(#sunGradient)" />
  <circle cx="100" cy="70" r="18" fill="#f1c40f" />
  
  <!-- Rays around sun -->
  <g stroke="#e67e22" stroke-width="2" stroke-linecap="round">
    <line x1="100" y1="35" x2="100" y2="45" />
    <line x1="100" y1="105" x2="100" y2="95" />
    <line x1="65" y1="70" x2="75" y2="70" />
    <line x1="135" y1="70" x2="125" y2="70" />
    <line x1="75" y1="45" x2="82" y2="52" />
    <line x1="125" y1="45" x2="118" y2="52" />
    <line x1="75" y1="95" x2="82" y2="88" />
    <line x1="125" y1="95" x2="118" y2="88" />
  </g>
  
  <!-- Tifinagh character "ⵣ" (Z - symbol of Amazigh identity) -->
  <path d="M100 110 L85 140 L115 140 Z" fill="none" stroke="#2c3e50" stroke-width="3" />
  <line x1="95" y1="125" x2="105" y2="125" stroke="#2c3e50" stroke-width="3" />
  
  <!-- Book/learning symbol at bottom -->
  <path d="M70 155 L70 175 L130 175 L130 155 Z" fill="none" stroke="#2c3e50" stroke-width="3" />
  <line x1="75" y1="160" x2="125" y2="160" stroke="#2c3e50" stroke-width="2" />
  <line x1="75" y1="165" x2="125" y2="165" stroke="#2c3e50" stroke-width="2" />
  <line x1="75" y1="170" x2="125" y2="170" stroke="#2c3e50" stroke-width="2" />
  
  <!-- Outer decorative ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#d4af37" stroke-width="3" stroke-dasharray="5,5" opacity="0.7" />
</svg>
