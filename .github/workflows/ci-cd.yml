name: CI/CD Pipeline

on:
  push:
    branches: [ genai, main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '7.4'
        extensions: mbstring, mysql, xml, curl
        coverage: xdebug
    
    - name: Install WordPress
      run: |
        bash tests/setup-wordpress.sh
    
    - name: Run Unit Tests
      run: php tests/test-ui-ux.php
    
    - name: Run Integration Tests
      run: php tests/test-integration.php
    
    - name: Run Security Tests
      run: php tests/test-security.php
    
    - name: Run Performance Budget
      run: php tests/test-performance-budget.php
    
    - name: Run PWA Tests
      run: php tests/test-pwa.php
    
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results
        path: tests/results/

  deploy-staging:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/genai'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy to Staging
      run: |
        echo "Deploying to staging environment..."
        # Add deployment script here
        # Example: rsync, scp, or API call to hosting provider
    
  deploy-production:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy to Production
      run: |
        echo "Deploying to production environment..."
        # Add deployment script here
